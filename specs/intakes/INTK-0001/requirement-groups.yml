version: 1
intake: INTK-0001
groups:
  - id: INTK-0001-GRP-01
    order: 1
    name: Vehicle Asset Records
    description: "Capturing and maintaining fleet vehicle records — their identity, current condition, and service history — and the saved lists used to manage the fleet day to day."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§3 Business Information Requirements"
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§4.1 Recording and maintaining a vehicle"
  - id: INTK-0001-GRP-02
    order: 2
    name: Maintenance Job Management
    description: "Raising, viewing, and progressing maintenance jobs against vehicles, and the saved lists that support daily job work."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§3 Business Information Requirements"
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§4.2 Raising and progressing a maintenance job"
  - id: INTK-0001-GRP-03
    order: 3
    name: Parts Consumption and Costing
    description: "Recording the parts consumed on a maintenance job and deriving the line value and job cost of those parts."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§3 Business Information Requirements"
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§4.2 Raising and progressing a maintenance job"
  - id: INTK-0001-GRP-04
    order: 4
    name: Data Model Integrity and Relationships
    description: "The value lists, real record links, relationship multiplicities, removal rules, and search that keep fleet information trustworthy and navigable."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§3 Business Information Requirements"
  - id: INTK-0001-GRP-05
    order: 5
    name: Job Completion Enforcement
    description: "The rules that govern when and how a maintenance job may be completed, enforced on every route into the system with clear feedback."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§4.3 Completing a job"
  - id: INTK-0001-GRP-06
    order: 6
    name: Automated Follow-up and Orchestration
    description: "The automatic updates and tasks raised when a job is completed or raised at high priority, kept within the maintenance workspace."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§4.4 Automatic follow-up"
  - id: INTK-0001-GRP-07
    order: 7
    name: Users and Access
    description: "The roles, business-unit access model, team-based access provisioning, and single application structure for fleet operations."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§5 Users and Access Requirements"
  - id: INTK-0001-GRP-08
    order: 8
    name: Non-Functional Expectations
    description: "Performance and scale, reliable and idempotent automation, visible failures, immediate rule feedback, and reporting-ready data."
    evidence:
      - source_file: intake/contoso/2026-08-11/Contoso-Service-Fleet-Maintenance-Business-Requirements.docx
        location: "§6 Non-Functional Expectations"
