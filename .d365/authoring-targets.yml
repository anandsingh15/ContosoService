schema_version: 1

# Consumer-owned authoring identities. Replace both sentinels before Dataverse
# implementation. Never store credentials, tokens, secrets, or secret-bearing
# URLs here.
environments:
  authoring-dataverse:
    environment_url: https://org89912357.crm.dynamics.com
    environment_id: 89a7081d-6701-f111-8c79-6045bd005919
    authentication_mode: interactive_user
    connection_alias: dataverse-authoring
    description: APACAgentTechDataverse production Dataverse (Organization ID 89a7081d-6701-f111-8c79-6045bd005919).

solutions:
  application-solution:
    environment: authoring-dataverse
    unique_name: ContosoService
    display_name: Contoso Service
    publisher_name: AnandPOC
    publisher_prefix: aks

targets:
  dataverse-solution-authoring:
    kind: dataverse_solution
    environment: authoring-dataverse
    solution: application-solution
  dataverse-environment-authoring:
    kind: dataverse_environment
    environment: authoring-dataverse

routing:
  # Environment-bound data components take precedence over their broader
  # solution-bound families.
  - match: {component_type: sec_business_unit}
    target: dataverse-environment-authoring
  - match: {component_type: sec_team}
    target: dataverse-environment-authoring
  - match: {component_type: config_queue}
    target: dataverse-environment-authoring
  - match: {component_type: config_audit}
    target: dataverse-environment-authoring
  - match: {component_type: "schema_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "config_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "uiux_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "flow_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "code_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "mcs_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "sec_*"}
    target: dataverse-solution-authoring
  - match: {component_type: "integ_*"}
    target: dataverse-solution-authoring
