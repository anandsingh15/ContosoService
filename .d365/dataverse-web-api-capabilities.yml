profiles:
  metadata-table-create:
    support: supported
    operation: create
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: metadata, path_template: EntityDefinitions}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}, rationale: Target-read the exact logical name and verify routed-solution membership.}
    fallback: &portal_fallback {resource: maker-portal, allowed_when: documented_operation_unsupported_or_primary_unavailable, issue_evidence_required: true}
    executor: {supported: true, builder: schema_table}
    rationale: &mcp_rationale Generic MCP writes do not guarantee the documented explicit custom-solution header; Web API is compiler-bound and MCP is verification-only.
    official_references: [optional_parameters, table_definitions, http]
  metadata-table-update:
    support: supported
    operation: update
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes"}
    recovery_http: {method: PUT, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}, rationale: Verify only the exact existing table and child columns added by the compiler-owned extension payload.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_table}
    rationale: A schema_table update creates missing child columns with POST; evidence-gated recovery target-reads declared children and uses GET-merge-PUT only for exact existing child identities. Every write uses the documented solution header and MCP remains verification-only.
    official_references: [optional_parameters, table_definitions, column_definitions, publish_xml]
  metadata-table-delete:
    support: supported
    operation: delete
    primary_resource: dataverse-web-api
    http: {method: DELETE, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}, rationale: Confirm the exact table no longer exists; do not infer another identity.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_table}
    destructive_effect: environment_delete
    rationale: HTTP DELETE destroys the table in the environment; it is never substituted for RemoveSolutionComponent.
    official_references: [optional_parameters, table_definitions]
  metadata-table-verify:
    support: supported
    operation: verify
    primary_resource: dataverse-web-api
    http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{identity}')"}, rationale: Read the canonical table identity and exact expected fields only.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: true, builder: schema_table}
    rationale: Web API or MCP targeted reads verify the result without solution export or unpack.
    official_references: [table_definitions]
  metadata-column-create:
    support: supported
    operation: create
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: Verify the exact table and column logical names.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_column}
    rationale: *mcp_rationale
    official_references: [optional_parameters, column_definitions]
  metadata-column-update:
    support: supported
    operation: update
    primary_resource: dataverse-web-api
    http: {method: PUT, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: "Retrieve, merge, replace, publish, and verify the exact column definition."}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_column}
    rationale: *mcp_rationale
    official_references: [optional_parameters, column_definitions, publish_xml]
  metadata-column-delete:
    support: supported
    operation: delete
    primary_resource: dataverse-web-api
    http: {method: DELETE, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: Confirm only the canonical column was removed.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_column}
    destructive_effect: environment_delete
    rationale: HTTP DELETE destroys the column in the environment and never means solution-membership removal.
    official_references: [optional_parameters, column_definitions]
  metadata-column-verify:
    support: supported
    operation: verify
    primary_resource: dataverse-web-api
    http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: Target-read the exact column.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: true, builder: schema_column}
    rationale: Targeted verification avoids broad table or solution inventory.
    official_references: [column_definitions]
  derived-column-create:
    support: supported
    operation: create
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-web-api, http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: Verify the exact derived column by table and logical name through the compiler-bound executor.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_derived_column}
    rationale: &derived_rationale Formula columns (SourceType=3, Power Fx) are supported via Web API with FormulaDefinition property. Calculated columns (SourceType=1, XAML) and Rollup columns (SourceType=2) are NOT settable via Web API; Dataverse rejects hand-authored RollupStateData and XAML. Formula columns use derived_type=formula with a Power Fx definition. Calculated and rollup columns require a base schema_column followed by exclusive Maker Portal configuration, Export-DvSolutionToSource, and committed solution XML. See the registered dataverse-table schema_derived_column guidance.
    official_references: [optional_parameters, column_definitions, publish_xml]
  derived-column-update:
    support: supported
    operation: update
    primary_resource: dataverse-web-api
    http: {method: PUT, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-web-api, http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: "Retrieve, merge, and verify the exact derived column definition through the compiler-bound executor."}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_derived_column}
    rationale: *derived_rationale
    official_references: [optional_parameters, column_definitions, publish_xml]
  derived-column-delete:
    support: supported
    operation: delete
    primary_resource: dataverse-web-api
    http: {method: DELETE, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-web-api, http: {method: GET, endpoint_family: metadata, path_template: "EntityDefinitions(LogicalName='{table}')/Attributes(LogicalName='{identity}')"}, rationale: Confirm through the compiler-bound executor that only the exact derived column was removed.}
    fallback: *portal_fallback
    executor: {supported: true, builder: schema_derived_column}
    destructive_effect: environment_delete
    rationale: HTTP DELETE destroys the derived column in the environment and never means solution-membership removal.
    official_references: [column_definitions, publish_xml]
  derived-column-verify:
    support: supported
